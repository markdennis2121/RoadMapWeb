<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Roadmap Tracker - Track your web development learning journey.">
    <title>Roadmap Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="app-header">
        <div class="header-content container">
            <div class="logo">
                <img src="logo.png" alt="logo" width="50" height="50">
                <h1>Roadmap Tracker</h1>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="btn-icon" aria-label="Toggle Theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Dashboard Section -->
        <section class="dashboard card glassmorphism">
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>Total Topics</h3>
                    <p id="totalTopics">0</p>
                </div>
                <div class="stat-box">
                    <h3>In Progress</h3>
                    <p id="inProgressTopics" class="text-warning">0</p>
                </div>
                <div class="stat-box">
                    <h3>Completed</h3>
                    <p id="completedTopics" class="text-success">0</p>
                </div>
                <div class="stat-box progress-box">
                    <h3>Overall Progress</h3>
                    <div class="progress-container">
                        <div class="progress-bar-wrap">
                            <div id="overallProgressBar" class="progress-bar" style="width: 0%"></div>
                        </div>
                        <span id="overallProgressText">0%</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Controls Section -->
        <section class="controls-section">
            <div class="search-filter">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search topics or projects...">
                </div>
                <select id="statusFilter" class="dropdown">
                    <option value="all">Show All</option>
                    <option value="not-started">Show Not Started</option>
                    <option value="in-progress">Show In Progress</option>
                    <option value="completed">Show Completed</option>
                </select>
            </div>
            <div class="action-buttons">
                <button id="addCustomBtn" class="btn btn-primary">Add Custom Item</button>
                <button id="exportBtn" class="btn btn-secondary">Export JSON</button>
                <button id="resetBtn" class="btn btn-danger">Reset</button>
            </div>
        </section>

        <!-- Categories & Roadmap Sections -->
        <div class="roadmap-grid" id="roadmapContainer">
            <!-- Dynamic Content goes here -->
        </div>

        <div class="section-divider">
            <h2>Projects</h2>
        </div>

        <div class="projects-grid" id="projectsContainer">
            <!-- Dynamic Projects go here -->
        </div>
    </main>

    <!-- Modals -->
    <div id="addModal" class="modal">
        <div class="modal-content glassmorphism">
            <div class="modal-header">
                <h2>Add Custom Item</h2>
                <button class="close-modal">&times;</button>
            </div>
            <form id="addForm">
                <div class="form-group">
                    <label for="itemType">Type</label>
                    <select id="itemType" class="dropdown">
                        <option value="topic">Roadmap Topic</option>
                        <option value="project">Project</option>
                    </select>
                </div>
                <div class="form-group" id="categoryGroup">
                    <label for="itemCategory">Category (for topic)</label>
                    <select id="itemCategory" class="dropdown">
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="itemTitle">Title</label>
                    <input type="text" id="itemTitle" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Add Item</button>
            </form>
        </div>
    </div>

    <div id="resetModal" class="modal">
        <div class="modal-content glassmorphism">
            <div class="modal-header">
                <h2>Confirm Reset</h2>
                <button class="close-modal">&times;</button>
            </div>
            <p>Are you sure you want to reset all your progress? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="cancelResetBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmResetBtn" class="btn btn-danger">Yes, Reset</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
